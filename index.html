<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Curtin University 3D Campus Map</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.117/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.117/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Loading Screen -->
<div id="loading-overlay">
  <div id="loading-content">
    <div id="loading-spinner"></div>
    <p id="loading-text">Loading campus...</p>
  </div>
</div>

<!-- Cesium Viewer -->
<div id="cesiumContainer"></div>

<!-- Left Column: Search + Info panels stacked on desktop -->
<div id="left-column">
  <!-- Search Panel -->
  <div id="ui-overlay">
    <div id="ui-header" onclick="togglePanel()">
      <span id="header-title">🏛️ Curtin Bentley Campus</span>
      <button id="toggle-btn">▼</button>
    </div>

    <div id="ui-content">
      <div id="search-row">
        <input type="text" id="searchInput" placeholder="Search building (e.g. 109, 206)..." />
        <button id="searchButton">Search</button>
      </div>

      <div id="location-section">
        <p id="location-label">📍 Location: <span id="location-type-text" style="color: #007bff; font-weight: bold;">GPS</span></p>
        <div id="location-buttons-container">
          <button id="setLocationBtn" onclick="enableManualLocationSetting()">📍 Set My Location</button>
          <button id="refreshGpsBtn" onclick="updateUserLocation()">🔄 Refresh GPS</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reset Camera Button -->
  <button id="reset-view-btn" onclick="window.resetCampusView()">🔄 Reset Camera</button>

  <!-- Map Pick Panel (shown when user picks location/start on map) -->
  <div id="map-pick-panel" style="display:none;">
    <div id="map-pick-header">
      <span id="map-pick-title">📍 Set Your Location</span>
    </div>
    <div id="map-pick-content">
      <p id="map-pick-instruction">Tap the map to set your location</p>
      <button id="map-pick-cancel" onclick="window.cancelMapPick()">Cancel</button>
    </div>
  </div>

  <!-- Info Panel (Bottom Sheet on Mobile, stacked on Desktop) -->
  <div id="info-panel">
    <div id="info-handle"></div>
    <button class="close-btn" id="closeButton">×</button>
    <div id="info-content"></div>
  </div>
</div>

<!-- Navigation Instruction Banner (shown during trip) -->
<div id="nav-instruction-banner">
    <div id="nav-main-instruction">Starting navigation...</div>
    <div id="nav-sub-instruction"></div>
</div>

<!-- Navigation Bottom Bar (shown during trip) -->
<div id="nav-bottom-bar">
    <div id="nav-info">
        <span id="nav-remaining-distance">0m</span>
        <span id="nav-remaining-time">~0 mins</span>
    </div>
    <button onclick="stopTrip()">■ Stop</button>
</div>

<!-- Main Script -->
<script type="module" src="js/main.js"></script>
<script>
  function togglePanel() {
    const content = document.getElementById('ui-content');
    const btn = document.getElementById('toggle-btn');
    const isHidden = content.style.display === 'none';
    content.style.display = isHidden ? 'block' : 'none';
    btn.textContent = isHidden ? '▼' : '▲';
    if (isHidden) {
      const sr = document.getElementById('search-row');
      const ls = document.getElementById('location-section');
      if (sr) sr.style.display = '';
      if (ls) ls.style.display = '';
    }
  }
</script>
</body>
</html>
